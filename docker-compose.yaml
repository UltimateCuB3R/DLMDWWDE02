services:
  grafana:
    image: grafana/grafana:latest
    container_name: mlb-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - postgres


  mlb-jobmanager:
    build:
      context: ./calculation
      dockerfile: Dockerfile
    hostname: "mlb-jobmanager"
    expose:
      - "6123"
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: mlb-jobmanager
      - KAFKA_HOST=kafka
      - KAFKA_PORT=9092
      - KAFKA_TOPIC=game-events
      - POSTGRES_DB_CONNECT_STRING=postgresql+psycopg://postgres:mysecretpassword@postgres:5432/postgres
      - POSTGRES_TABLE_DEFINITION=/opt/flink/usrlib/table_definition.xml
      - POSTGRES_DB_JDBC_URL=jdbc:postgresql://postgres:5432/postgres
      - LOGGER_JOB_NAME=calculation_job
      - LOGGER_JOB_PATH=/opt/flink/usrlib/logs/

  mlb-taskmanager:
    build:
      context: ./calculation
      dockerfile: Dockerfile
    hostname: "mlb-taskmanager"
    depends_on:
      - mlb-jobmanager
    expose:
      - "6121"
      - "6122"
    command: taskmanager
    links:
      - mlb-jobmanager:mlb-jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: mlb-jobmanager
        taskmanager.numberOfTaskSlots: 1
      - KAFKA_HOST=kafka
      - KAFKA_PORT=9092
      - KAFKA_TOPIC=game-events
      - POSTGRES_DB_CONNECT_STRING=postgresql+psycopg://postgres:mysecretpassword@postgres:5432/postgres
      - POSTGRES_TABLE_DEFINITION=/opt/flink/usrlib/table_definition.xml
      - POSTGRES_DB_JDBC_URL=jdbc:postgresql://postgres:5432/postgres
      - LOGGER_JOB_NAME=calculation_job
      - LOGGER_JOB_PATH=/opt/flink/usrlib/

  kafka:
    image: apache/kafka:latest
    container_name: mlb-kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      CLUSTER_ID: mlb-kafka
    volumes:
      - kafka_data:/var/lib/kafka/data

  replay:
    build:
      context: ./replay
      dockerfile: Dockerfile
    container_name: mlb-replay
    ports:
      - "8001:8001"
    depends_on:
      - kafka
      - postgres
    environment:
      - KAFKA_HOST=kafka
      - KAFKA_PORT=9092
      - KAFKA_TOPIC=game-events
      - KAFKA_REPLAY_DELAY=0.5
      - KAFKA_REPLAY_GAME_OFFSET=30
      - KAFKA_REPLAY_GAME_LIMIT=5
      - LOGGER_NAME=replay
      - LOGGER_PATH=.
      - LOGGER_LEVEL=DEBUG
      - ENCODING=utf-8
      - POSTGRES_DB_CONNECT_STRING=postgresql+psycopg://postgres:mysecretpassword@postgres:5432/postgres

  ingest:
    build:
      context: ./ingestion
      dockerfile: Dockerfile
    container_name: mlb-ingest
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    environment:
      - LOGGER_NAME=ingest
      - LOGGER_PATH=.
      - LOGGER_LEVEL=DEBUG
      - INGESTION_PATH=/app/data/
      - CHUNK_SIZE=100000
      - ENCODING=utf-8
      - POSTGRES_DB_CONNECT_STRING=postgresql+psycopg://postgres:mysecretpassword@postgres:5432/postgres

  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    container_name: mlb-postgres
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=mysecretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  kafka_data:
  grafana_data: