[project]
name = "dataengineering"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "apache-flink==1.18.0",
    "fastapi>=0.116.1",
    "kafka-python>=3.0.10",
    "pandas",
    "pandas-stubs",
    "pydantic>=2.11.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.35.0",
]

[tool.uv.extra-build-dependencies]
apache-beam = ["setuptools<81"]
pyarrow = ["Cython", "setuptools<81"]
